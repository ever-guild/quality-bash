name: QA
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - example.sh
      - example.bats
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: make quality-bash
