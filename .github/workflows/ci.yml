name: Go checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - name: Test Go infrastructure
        run: go test -race ./...
      - name: Install build dependencies and test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake g++ make python3 libcurl4-openssl-dev libdw-dev libelf-dev binutils-dev zlib1g-dev libssl-dev bats shellcheck
      - name: Build pinned kcov
        run: go run ./cmd/build-kcov --prefix "$RUNNER_TEMP/kcov"
      - name: Run all integration tests
        run: PATH="$RUNNER_TEMP/kcov/bin:$PATH" go test -race -count=1 -v ./...
      - name: Vet
        run: go vet ./...
      - name: Build CLI
        run: go build -trimpath -o quality-bash ./cmd/quality-bash
      - name: Check version
        run: ./quality-bash version
