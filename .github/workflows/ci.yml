name: Go checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true
      - name: Test Go infrastructure
        run: make test
      - name: Install build dependencies and test tools
        run: make ci-deps
      - name: Build pinned kcov
        run: make kcov
      - name: Run all integration tests
        run: make integration
      - name: Package external tools
        run: make bundle-tools
      - name: Verify packaged tools
        run: make verify-tools
      - uses: actions/upload-artifact@v7
        with:
          name: tools-${{ runner.arch }}
          path: tool-dist/
      - name: Vet
        run: make vet
      - name: Build CLI
        run: make build
      - name: Check version
        run: make version
