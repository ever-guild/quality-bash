name: Go checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true
      - name: Test Go infrastructure
        run: make test
      - name: Install ready upstream tools
        run: make ci-deps
      - name: Run all integration tests
        run: make integration
      - name: Vet
        run: make vet
      - name: Build CLI
        run: make build
      - name: Run the minimal example
        run: make check-example
      - name: Check version
        run: make version
