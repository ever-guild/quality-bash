name: Go checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
          cache: true
      - name: Test Go infrastructure
        run: go test -race ./...
      - name: Install build dependencies and test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake g++ make python3 libcurl4-openssl-dev libdw-dev libelf-dev binutils-dev zlib1g-dev libssl-dev bats shellcheck
      - name: Build pinned kcov
        run: go run ./cmd/build-kcov --prefix "$RUNNER_TEMP/kcov"
      - name: Run all integration tests
        run: PATH="$RUNNER_TEMP/kcov/bin:$PATH" go test -race -count=1 -v ./...
      - name: Package external tools
        run: go run ./cmd/bundle-tools --kcov "$RUNNER_TEMP/kcov/bin/kcov" --output tool-dist
      - name: Verify packaged tools
        run: go run ./cmd/check-tool-bundles --directory tool-dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tools-${{ runner.arch }}
          path: tool-dist/
      - name: Vet
        run: go vet ./...
      - name: Build CLI
        run: go build -trimpath -o quality-bash ./cmd/quality-bash
      - name: Check version
        run: ./quality-bash version
