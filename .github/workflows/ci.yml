name: Go checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - name: Test Go infrastructure
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build CLI
        run: go build -trimpath -o quality-bash ./cmd/quality-bash
      - name: Check version
        run: ./quality-bash version
