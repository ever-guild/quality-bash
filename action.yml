name: quality-bash
description: Bash lint, tests, coverage, mutation testing and baseline gate
inputs:
  command:
    description: CLI command
    default: qa
  root:
    description: Project root
    default: .
  scripts:
    description: Newline-separated script paths
    default: ''
  tests:
    description: Newline-separated Bats paths
    default: ''
  baseline:
    description: Baseline path relative to root
    default: quality-baseline.json
  reports:
    description: Reports path relative to root
    default: quality-reports
  base-revision:
    description: Target Git revision whose baseline must also pass
    default: ${{ github.event.pull_request.base.sha }}
  jobs:
    description: Parallel mutation workers
    default: '1'
  timeout:
    description: Timeout per external process
    default: 5m
outputs:
  coverage_numerator:
    description: Covered lines
    value: ${{ steps.check.outputs.coverage_numerator }}
  coverage_denominator:
    description: Counted lines
    value: ${{ steps.check.outputs.coverage_denominator }}
  mutation_numerator:
    description: Detected mutations
    value: ${{ steps.check.outputs.mutation_numerator }}
  mutation_denominator:
    description: Valid mutations
    value: ${{ steps.check.outputs.mutation_denominator }}
  passed:
    description: Whether the quality gate passed
    value: ${{ steps.check.outputs.passed }}
runs:
  using: composite
  steps:
    - name: Resolve report path
      id: reports
      shell: bash
      env:
        QB_ROOT: ${{ inputs.root }}
        QB_REPORTS: ${{ inputs.reports }}
      run: |
        case "$QB_REPORTS" in
          /*) path="$QB_REPORTS" ;;
          *) path="$QB_ROOT/$QB_REPORTS" ;;
        esac
        if [[ "$path" == *$'\n'* || "$path" == *$'\r'* ]]; then
          echo 'Report paths containing newlines are unsupported by the Action' >&2
          exit 1
        fi
        echo "path=$path" >> "$GITHUB_OUTPUT"
    - name: Download release binary
      id: binary
      shell: bash
      env:
        RUNNER_ARCH_VALUE: ${{ runner.arch }}
      run: |
        case "$RUNNER_ARCH_VALUE" in
          X64) arch=amd64; digest=cc10fef98cac6450f191161f8a83a105a043bfb5310fe555a4a9e5f2a809253f ;;
          ARM64) arch=arm64; digest=b656d373c312b626724913e397f8aa08290ac3298c31e3e9b5bec1d6920546cb ;;
          *) echo 'Unsupported runner architecture' >&2; exit 1 ;;
        esac
        directory=$(mktemp -d "$RUNNER_TEMP/quality-bash.XXXXXXXX")
        echo "artifact=${directory##*/}" >> "$GITHUB_OUTPUT"
        echo "cache=$directory/cache" >> "$GITHUB_OUTPUT"
        release=https://github.com/ever-guild/quality-bash/releases/download/v1.0.0-alpha.1
        asset="quality-bash-v1.0.0-alpha.1-linux-$arch.tar.gz"
        curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' "$release/$asset" -o "$directory/$asset"
        cd "$directory"
        printf '%s  %s\n' "$digest" "$asset" > selected.sha256
        sha256sum --check selected.sha256
        tar -xzf "$asset"
        echo "path=$directory/quality-bash" >> "$GITHUB_OUTPUT"
    - name: Install pinned tools
      shell: bash
      env:
        QB_BINARY: ${{ steps.binary.outputs.path }}
        XDG_CACHE_HOME: ${{ steps.binary.outputs.cache }}
      run: '"$QB_BINARY" tools install'
    - name: Run quality checks
      id: check
      shell: bash
      env:
        QB_BINARY: ${{ steps.binary.outputs.path }}
        XDG_CACHE_HOME: ${{ steps.binary.outputs.cache }}
        QB_COMMAND: ${{ inputs.command }}
        QB_ROOT: ${{ inputs.root }}
        QB_SCRIPTS: ${{ inputs.scripts }}
        QB_TESTS: ${{ inputs.tests }}
        QB_BASELINE: ${{ inputs.baseline }}
        QB_REPORTS: ${{ inputs.reports }}
        QB_BASE_REVISION: ${{ inputs.base-revision }}
        QB_JOBS: ${{ inputs.jobs }}
        QB_TIMEOUT: ${{ inputs.timeout }}
      run: |
        case "$QB_COMMAND" in
          qa|lint|test|coverage|mutation|doctor) args=("$QB_COMMAND") ;;
          'baseline check') args=(baseline check) ;;
          *) echo 'Unsupported Action command' >&2; exit 1 ;;
        esac
        args+=(--root "$QB_ROOT" --baseline "$QB_BASELINE" --reports "$QB_REPORTS" --jobs "$QB_JOBS" --timeout "$QB_TIMEOUT")
        if [[ -n "$QB_BASE_REVISION" ]]; then args+=(--base-revision "$QB_BASE_REVISION"); fi
        while IFS= read -r path; do
          if [[ -n "$path" ]]; then args+=(--script "$path"); fi
        done <<< "$QB_SCRIPTS"
        while IFS= read -r path; do
          if [[ -n "$path" ]]; then args+=(--test "$path"); fi
        done <<< "$QB_TESTS"
        "$QB_BINARY" "${args[@]}"
    - name: Preserve diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ steps.binary.outputs.artifact || format('quality-bash-{0}-{1}-{2}', github.job, runner.arch, github.run_attempt) }}
        path: ${{ steps.reports.outputs.path }}
        if-no-files-found: ignore
